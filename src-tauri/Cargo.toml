[package]
name = "nexus-ai"
version = "0.1.0"
description = "Native macOS AI assistant with floating overlay"
authors = ["Nexus-AI Team"]
license = "MIT"
repository = "https://github.com/yourusername/Nexus-AI"
edition = "2021"

[lib]
name = "nexus_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-macros = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.2", features = ["json", "stream"] }
tokio = { version = "1.51.0", features = ["macros"] }
futures-util = "0.3.32"
tokio-util = "0.7"
rusqlite = { version = "0.39", features = ["bundled"] }
calamine = "0.31"
quick-xml = "0.38"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
thiserror = "2"
anyhow = "1"
once_cell = "1"
parking_lot = "0.12"
lazy_static = "1.5"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
urlencoding = "2.1"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
core-graphics = "0.25"
core-foundation = "0.10"
cocoa = "0.25"

[dev-dependencies]
mockito = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true

[profile.dev]
incremental = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)', 'cfg(coverage)'] }
