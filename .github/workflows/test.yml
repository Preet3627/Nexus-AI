name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        rust: [stable, nightly]
        exclude:
          - os: ubuntu-latest
            rust: stable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache Rust target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.rust }}-
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: npm ci

      - name: Type check (npm)
        run: npm run typecheck

      - name: Lint (npm)
        run: npm run lint

      - name: Rust tests
        if: matrix.os == 'macos-latest'
        run: |
          cd src-tauri
          cargo test --lib --all-features
          cargo test --doc

      - name: Rust clippy
        if: matrix.os == 'macos-latest'
        run: |
          cd src-tauri
          cargo clippy -- -D warnings

      - name: Rust format check
        run: |
          cd src-tauri
          cargo fmt --check

  integration-test:
    runs-on: macos-latest
    needs: [test]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache XcodeGen
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.neovimstellungen.synne
            /usr/local/bin/xcodegen
          key: ${{ runner.os }}-xcodegen

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Cellar/xcodegen
            /opt/homebrew/Cellar/xcodegen
          key: ${{ runner.os }}-homebrew-xcodegen-${{ hashFiles('.github/workflows/test.yml') }}
          restore-keys: |
            ${{ runner.os }}-homebrew-xcodegen-

      - name: Install dependencies
        run: npm ci

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: npm run generate

      - name: Build (debug)
        run: npm run tauri build -- --debug
        timeout-minutes: 30

  security-audit:
    runs-on: ubuntu-latest
    needs: [test]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run security audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  coverage:
    runs-on: macos-latest
    needs: [test]
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache Rust target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            target/
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-coverage-

      - name: Install dependencies
        run: npm ci

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: npm run generate

      - name: Run tests with coverage
        run: |
          cargo install cargo-llvm-cov
          cargo llvm-cov --all-features --all-targets --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
