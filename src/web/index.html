<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus-AI</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: rgba(30, 30, 40, 0.95);
        color: #fff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        border-radius: 12px;
        overflow: hidden;
      }
      .container {
        flex: 1;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        -webkit-app-region: drag;
        padding-bottom: 8px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      .title {
        font-size: 16px;
        font-weight: 600;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .controls {
        display: flex;
        gap: 8px;
        -webkit-app-region: no-drag;
      }
      .controls button {
        background: transparent;
        border: none;
        color: #888;
        cursor: pointer;
        padding: 4px 8px;
        font-size: 14px;
        border-radius: 4px;
      }
      .controls button:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
      }
      .controls button.close:hover {
        background: rgba(255, 59, 48, 0.8);
        color: #fff;
      }
      .chat-area {
        flex: 1;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 8px;
        padding: 12px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .message {
        padding: 8px 12px;
        border-radius: 8px;
        max-width: 85%;
        line-height: 1.4;
      }
      .message.user {
        background: rgba(102, 126, 234, 0.4);
        align-self: flex-end;
      }
      .message.assistant {
        background: rgba(118, 75, 162, 0.4);
      }
      .message.error {
        background: rgba(255, 59, 48, 0.3);
      }
      .input-area {
        display: flex;
        gap: 8px;
      }
      .input-area input {
        flex: 1;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        color: #fff;
        font-size: 14px;
      }
      .input-area input:focus {
        outline: none;
        border-color: #667eea;
      }
      .input-area input:disabled {
        opacity: 0.5;
      }
      .input-area button {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        border-radius: 8px;
        padding: 10px 18px;
        color: #fff;
        cursor: pointer;
        font-weight: 500;
        font-size: 14px;
      }
      .input-area button:hover {
        opacity: 0.9;
      }
      .input-area button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .status {
        font-size: 11px;
        color: #666;
        text-align: center;
      }

      /* Setup Screen */
      .setup-screen {
        display: none;
        flex-direction: column;
        gap: 16px;
        padding: 20px;
      }
      .setup-screen.active {
        display: flex;
      }
      .setup-title {
        font-size: 20px;
        font-weight: 600;
        text-align: center;
        margin-bottom: 8px;
      }
      .setup-subtitle {
        font-size: 14px;
        color: #888;
        text-align: center;
        margin-bottom: 16px;
      }
      .provider-tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }
      .provider-tab {
        flex: 1;
        padding: 10px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        color: #888;
        cursor: pointer;
        text-align: center;
        font-size: 13px;
      }
      .provider-tab.active {
        background: rgba(102, 126, 234, 0.3);
        border-color: #667eea;
        color: #fff;
      }
      .form-group {
        margin-bottom: 12px;
      }
      .form-group label {
        display: block;
        font-size: 12px;
        color: #888;
        margin-bottom: 6px;
      }
      .form-group input,
      .form-group select {
        width: 100%;
        padding: 10px 12px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 6px;
        color: #fff;
        font-size: 14px;
      }
      .form-group input:focus,
      .form-group select:focus {
        outline: none;
        border-color: #667eea;
      }
      .setup-btn {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        border-radius: 8px;
        color: #fff;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        margin-top: 8px;
      }
      .setup-btn:hover {
        opacity: 0.9;
      }
      .chat-view {
        display: flex;
        flex-direction: column;
        flex: 1;
      }
      .chat-view.hidden {
        display: none;
      }
      .settings-btn {
        background: transparent;
        border: none;
        color: #888;
        cursor: pointer;
        padding: 4px 6px;
        font-size: 14px;
      }
      .settings-btn:hover {
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="title">Nexus-AI</div>
        <div class="controls">
          <button class="settings-btn" id="settingsBtn" title="Settings">
            ⚙
          </button>
          <button
            class="settings-btn"
            id="backBtn"
            style="display: none"
            title="Back"
          >
            ←
          </button>
          <button class="close" id="closeBtn" title="Close">✕</button>
        </div>
      </div>

      <!-- Setup Screen -->
      <div class="setup-screen" id="setupScreen">
        <div class="setup-title">Welcome to Nexus-AI</div>
        <div class="setup-subtitle">
          Connect your AI provider to get started
        </div>

        <div class="provider-tabs">
          <div class="provider-tab active" data-provider="ollama">Ollama</div>
          <div class="provider-tab" data-provider="openai">OpenAI</div>
          <div class="provider-tab" data-provider="anthropic">Anthropic</div>
        </div>

        <div class="form-group">
          <label>API URL / Endpoint</label>
          <input
            type="text"
            id="apiUrl"
            placeholder="http://localhost:11434"
            value="http://localhost:11434"
          />
        </div>

        <div class="form-group" id="modelGroup">
          <label>Model</label>
          <input
            type="text"
            id="modelName"
            placeholder="llama3"
            value="llama3"
          />
        </div>

        <div class="form-group" id="apiKeyGroup" style="display: none">
          <label>API Key</label>
          <input type="password" id="apiKey" placeholder="sk-..." />
        </div>

        <button class="setup-btn" id="connectBtn">
          Connect & Start Chatting
        </button>
      </div>

      <!-- Chat View -->
      <div class="chat-view hidden" id="chatView">
        <div class="chat-area" id="chatArea">
          <div class="message assistant">
            Hello! I'm Nexus-AI. How can I help you today?
          </div>
        </div>
        <div class="input-area">
          <input
            type="text"
            id="messageInput"
            placeholder="Type your message..."
          />
          <button id="sendBtn">Send</button>
        </div>
        <div class="status" id="status">Ready</div>
      </div>
    </div>

    <script type="module">
      import { invoke } from "@tauri-apps/api/core";
      import { getCurrentWindow } from "@tauri-apps/api/window";

      let currentProvider = "ollama";
      let config = {
        provider: "ollama",
        url: "http://localhost:11434",
        model: "llama3",
        apiKey: null,
      };

      const setupScreen = document.getElementById("setupScreen");
      const chatView = document.getElementById("chatView");
      const providerTabs = document.querySelectorAll(".provider-tab");
      const modelGroup = document.getElementById("modelGroup");
      const apiKeyGroup = document.getElementById("apiKeyGroup");
      const connectBtn = document.getElementById("connectBtn");
      const backBtn = document.getElementById("backBtn");
      const settingsBtn = document.getElementById("settingsBtn");
      const closeBtn = document.getElementById("closeBtn");

      async function checkConfig() {
        try {
          const settings = await invoke("get_settings");
          const storedConfig = settings.config;
          if (storedConfig && storedConfig.url) {
            config = storedConfig;
            showChatView();
          } else {
            showSetupView();
          }
        } catch {
          showSetupView();
        }
      }

      function showSetupView() {
        setupScreen.classList.add("active");
        chatView.classList.add("hidden");
        backBtn.style.display = "none";
        settingsBtn.style.display = "none";
      }

      function showChatView() {
        setupScreen.classList.remove("active");
        chatView.classList.remove("hidden");
        backBtn.style.display = "none";
        settingsBtn.style.display = "block";
      }

      providerTabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          providerTabs.forEach((t) => t.classList.remove("active"));
          tab.classList.add("active");
          currentProvider = tab.dataset.provider;

          if (currentProvider === "ollama") {
            document.getElementById("apiUrl").value = "http://localhost:11434";
            document.getElementById("modelGroup").style.display = "block";
            document.getElementById("apiKeyGroup").style.display = "none";
          } else {
            document.getElementById("modelGroup").style.display = "block";
            document.getElementById("apiKeyGroup").style.display = "block";

            if (currentProvider === "openai") {
              document.getElementById("apiUrl").value =
                "https://api.openai.com/v1";
            } else if (currentProvider === "anthropic") {
              document.getElementById("apiUrl").value =
                "https://api.anthropic.com/v1";
            }
          }
        });
      });

      connectBtn.addEventListener("click", async () => {
        config = {
          provider: currentProvider,
          url: document.getElementById("apiUrl").value,
          model: document.getElementById("modelName").value,
          apiKey: document.getElementById("apiKey").value || null,
        };

        try {
          await invoke("save_settings", {
            settings: {
              config,
              require_auth: true,
              auth_timeout: 300,
              storage_backend: "secure-enclave",
              enable_cloud_sync: false,
            },
          });
          showChatView();
        } catch (err) {
          alert("Failed to save settings: " + err);
        }
      });

      settingsBtn.addEventListener("click", () => {
        backBtn.style.display = "block";
        settingsBtn.style.display = "none";
        showSetupView();
      });

      backBtn.addEventListener("click", () => {
        backBtn.style.display = "none";
        showChatView();
      });

      closeBtn.addEventListener("click", async () => {
        const win = getCurrentWindow();
        await win.hide();
      });

      async function sendMessage() {
        const input = document.getElementById("messageInput");
        const btn = document.getElementById("sendBtn");
        const status = document.getElementById("status");
        const chatArea = document.getElementById("chatArea");
        const message = input.value.trim();

        if (!message) return;

        chatArea.innerHTML += `<div class="message user">${escapeHtml(message)}</div>`;
        input.value = "";
        btn.disabled = true;
        status.textContent = "Thinking...";

        try {
          const response = await invoke("chat", {
            messages: [{ role: "user", content: message }],
            config: config,
          });
          chatArea.innerHTML += `<div class="message assistant">${escapeHtml(response.content)}</div>`;
          status.textContent = "Ready";
        } catch (err) {
          chatArea.innerHTML += `<div class="message error">Error: ${escapeHtml(String(err))}</div>`;
          status.textContent = "Error occurred";
        }

        btn.disabled = false;
        chatArea.scrollTop = chatArea.scrollHeight;
      }

      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      document.getElementById("sendBtn").addEventListener("click", sendMessage);
      document
        .getElementById("messageInput")
        .addEventListener("keypress", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            sendMessage();
          }
        });

      checkConfig();
    </script>
  </body>
</html>
